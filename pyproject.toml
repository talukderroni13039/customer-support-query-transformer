[project]
name = "support-query-transformer"
version = "0.1.0"
description = "Customer support query transformer: rewrite -> hybrid retrieval (vector + BM25 + RRF) -> rerank"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.163.1",
    "instructor[anthropic]>=1.17.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "snowballstemmer>=3.1.1",
    "torch>=2.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF", "ASYNC", "S", "PT"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "sentence_transformers.*", "chromadb.*", "instructor.*", "yaml.*", "snowballstemmer.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not model and not live' --cov=src --cov-report=term-missing:skip-covered --cov-fail-under=80"
markers = [
    "model: loads the real embedding / reranker models (downloads once); excluded by default",
    "live: makes real Anthropic API calls (max 5); excluded by default",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
